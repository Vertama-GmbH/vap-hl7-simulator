name: Publish image

# On demand. The image changes when we decide to move the pinned library or the
# wrapper, never on a schedule and never from a branch the cluster tracks.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Tag to publish, e.g. v1.0.0'
        default: 'v1.0.0'
        required: true
      latest:
        description: 'Also move the `latest` tag to this build'
        type: boolean
        default: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      # Registry names must be lowercase, and the org is not: Vertama-GmbH.
      # Derived rather than hardcoded, so a repository rename carries through.
      - name: Lowercase the image name
        id: img
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64

      - name: Log in to the container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          # The btp nodes are amd64.
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.name }}:${{ inputs.image_tag }}
            ${{ inputs.latest && format('{0}/{1}:latest', env.REGISTRY, steps.img.outputs.name) || '' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.image_tag }}
            org.opencontainers.image.licenses=MIT
            org.opencontainers.image.description=HL7 v2 MLLP test receiver — ACKs everything, stores nothing

      - name: Summary
        run: |
          {
            echo "Published \`${REGISTRY}/${{ steps.img.outputs.name }}:${{ inputs.image_tag }}\`"
            echo ""
            echo "- built from commit \`${{ github.sha }}\`"
            echo "- pinned libraries: see [package.json](package.json)"
          } >> "$GITHUB_STEP_SUMMARY"
